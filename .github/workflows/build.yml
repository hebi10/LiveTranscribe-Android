name: Private Android APK

on:
  push:
    branches: [main, "feature/offline-korean-privacy"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Sign an update APK with the existing release key (main only)'
        type: boolean
        required: true
        default: false
      publish_preview:
        description: 'Publish the test-only APK as a separate-install prerelease (main only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source privacy contract
        run: python scripts/audit_privacy.py
      - name: Python regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Cache pinned speech support and language-ID assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/speech
            app/src/main/assets/language-id
            app/libs
          key: ${{ runner.os }}-local-ai-support-${{ hashFiles('scripts/prepare_speech_support.py', 'scripts/prepare_language_id.py') }}
      - name: Bundle pinned Silero speech detector (build-time only)
        run: python scripts/prepare_speech_support.py
      - name: Bundle offline acoustic language ID (build-time only)
        run: python scripts/prepare_language_id.py
      - name: Verify packaged support assets
        run: |
          python scripts/prepare_speech_support.py --verify-only
          python scripts/prepare_language_id.py --verify-only
      - name: Install pinned native build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare pinned local translation runtime source
        run: python scripts/prepare_native_translation.py
      - name: Unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Assert debug APK has model download network permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            AAPT=$(find "${ANDROID_HOME}/build-tools" -path "*/aapt" | sort -V | tail -n 1)
          fi
          "$AAPT" dump permissions "$APK" > /tmp/apk-permissions.txt
          cat /tmp/apk-permissions.txt
          for permission in INTERNET ACCESS_NETWORK_STATE; do
            if ! grep -Fq "android.permission.$permission'" /tmp/apk-permissions.txt; then
              echo "$permission permission required for model downloads is missing"
              exit 1
            fi
          done
      - name: Verify APK support assets and model download boundary
        run: python scripts/verify_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test-only debug APK (separate application ID)
        uses: actions/upload-artifact@v4
        with:
          name: hebi-live-translate-TEST-ONLY-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-request:
    if: github.event_name == 'workflow_dispatch' && (inputs.build_release || inputs.publish_preview)
    runs-on: ubuntu-latest
    steps:
      - name: Require the trusted main branch for release requests
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Signed releases and separate-install previews may only be requested from main. No signing secrets were loaded.'
            exit 1
          fi

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main'
    needs: [build, release-request]
    runs-on: ubuntu-latest
    # Configure this environment with main-only deployment branches and required
    # reviewers before provisioning its existing-key secrets. PR jobs never use it.
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Verify source privacy contract
        run: python scripts/audit_privacy.py
      - name: Bundle and verify pinned support assets (build-time only)
        run: |
          python scripts/prepare_speech_support.py
          python scripts/prepare_language_id.py
          python scripts/prepare_speech_support.py --verify-only
          python scripts/prepare_language_id.py --verify-only
      - name: Install pinned native and APK verification tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare pinned local translation runtime source
        run: python scripts/prepare_native_translation.py
      - name: Provision and verify the existing release signer
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: python scripts/release_signing.py prepare --keystore "$RUNNER_TEMP/live-translate-release.jks"
      - name: Build APK with the verified existing release signer
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/live-translate-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache lintRelease assembleRelease
      - name: Verify release APK signer and bundled-model boundary
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          python scripts/release_signing.py verify-apk --apk app/build/outputs/apk/release/app-release.apk --apksigner "${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          python scripts/verify_apk_assets.py app/build/outputs/apk/release/app-release.apk
      - name: Upload verified signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: hebi-live-translate-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary release keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/live-translate-release.jks"

  preview-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/main'
    needs: [build, release-request]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download this run's exact test-only debug APK
        uses: actions/download-artifact@v4
        with:
          name: hebi-live-translate-TEST-ONLY-debug
          path: preview-artifact
      - name: Prepare separate-install preview asset
        run: |
          test -f preview-artifact/app-debug.apk
          mkdir preview-release
          mv preview-artifact/app-debug.apk preview-release/LiveTranslate-v1.3.0-arm64-preview-separate.apk
      - name: Publish the separate-install preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd preview-release
          PREVIEW_TAG=v1.3.0-preview
          PREVIEW_APK=LiveTranslate-v1.3.0-arm64-preview-separate.apk
          sha256sum "$PREVIEW_APK" > "$PREVIEW_APK.sha256"
          cat > release-notes.md <<'NOTES'
          변경 사항

          - 말이 이어져도 확인된 문장부터 번역하는 처리를 보완했습니다.
          - 자동 언어 감지와 문장 확정 처리를 분리했습니다.
          - 종료 시 번역·음성 처리 정리 오류를 보완했습니다.
          - 화면 배율 변경 시 팝업 크기와 조작부를 보정했습니다.

          이 프리뷰는 `com.hebi.livetranslate.debug` 패키지의 별도 설치용 테스트 APK입니다. 기존 앱을 유지합니다(`com.hebi.livetranslate`). 정식 앱 업데이트가 아닙니다.

          프리뷰는 자체 모델과 설정을 사용합니다. 사용 전에 프리뷰 안에서 모델을 준비해야 하며 기존 앱의 모델·설정·기록을 이전하지 않습니다. 테스트용 서명자는 이후 빌드에서 달라질 수 있으므로 후속 프리뷰의 덮어쓰기 업데이트를 보장하지 않습니다.

          이 실행의 Android 빌드·lint·단위 테스트와 모델·개인정보 정적 검사를 통과한 아티팩트입니다. APK와 SHA-256 확인 파일을 첨부했습니다. 실기기 동작과 업데이트 호환성은 별도 확인이 필요합니다.
          NOTES
          # Creating the tag is atomic: an existing tag is never reused or moved.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$PREVIEW_TAG" -f "sha=$GITHUB_SHA" > /dev/null; then
            echo "::error::Preview tag $PREVIEW_TAG already exists or could not be created. No existing tag or release was overwritten."
            exit 1
          fi
          gh release create "$PREVIEW_TAG" "$PREVIEW_APK" "$PREVIEW_APK.sha256" --repo "$GITHUB_REPOSITORY" --title 'LiveTranslate v1.3.0 — 별도 설치 프리뷰' --notes-file release-notes.md --prerelease --latest=false --verify-tag
