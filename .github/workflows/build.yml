name: Private Android APK

on:
  push:
    branches: [main, "feature/offline-korean-privacy"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source privacy contract
        run: python scripts/audit_privacy.py
      - name: Bundle official Vosk models (build-time only)
        run: python scripts/prepare_vosk_models.py
      - name: Check packaged Vosk assets
        run: |
          test -s app/src/main/assets/models/vosk-model-small-en-us-0.15/conf/model.conf
          test -s app/src/main/assets/models/vosk-model-small-ja-0.22/conf/model.conf
      - name: Unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Assert debug APK has no app Internet permission
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            AAPT=$(find "${ANDROID_HOME}/build-tools" -path "*/aapt" | sort -V | tail -n 1)
          fi
          "$AAPT" dump permissions "$APK" > /tmp/apk-permissions.txt
          cat /tmp/apk-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt; then
            echo "INTERNET permission unexpectedly present"
            exit 1
          fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hebi-live-translate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
