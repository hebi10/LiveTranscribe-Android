name: Private Android APK

on:
  push:
    branches: [main, "feature/offline-korean-privacy"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source privacy contract
        run: python scripts/audit_privacy.py
      - name: Python regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Cache pinned speech support and language-ID assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/speech
            app/src/main/assets/language-id
            app/libs
          key: ${{ runner.os }}-local-ai-support-${{ hashFiles('scripts/prepare_speech_support.py', 'scripts/prepare_language_id.py') }}
      - name: Bundle pinned Silero speech detector (build-time only)
        run: python scripts/prepare_speech_support.py
      - name: Bundle offline acoustic language ID (build-time only)
        run: python scripts/prepare_language_id.py
      - name: Verify packaged support assets
        run: |
          python scripts/prepare_speech_support.py --verify-only
          python scripts/prepare_language_id.py --verify-only
      - name: Install pinned native build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare pinned local translation runtime source
        run: python scripts/prepare_native_translation.py
      - name: Unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Assert debug APK has model download network permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            AAPT=$(find "${ANDROID_HOME}/build-tools" -path "*/aapt" | sort -V | tail -n 1)
          fi
          "$AAPT" dump permissions "$APK" > /tmp/apk-permissions.txt
          cat /tmp/apk-permissions.txt
          for permission in INTERNET ACCESS_NETWORK_STATE; do
            if ! grep -Fq "android.permission.$permission'" /tmp/apk-permissions.txt; then
              echo "$permission permission required for model downloads is missing"
              exit 1
            fi
          done
      - name: Verify APK support assets and model download boundary
        run: |
          python - <<'PY'
          from hashlib import sha256
          from zipfile import ZipFile
          from scripts import prepare_language_id as language_id
          from scripts import prepare_speech_support as speech

          with ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              names = apk.namelist()
              allowed_models = {'assets/speech/silero_vad.onnx'} | {
                  f'assets/language-id/{language_id.MODEL_NAME}/{name}' for name in language_id.MODEL_FILES
              }
              if any(name.startswith('assets/models/') or name.lower().endswith('.gguf') for name in names):
                  raise SystemExit('Large or legacy recognizer/translation models must not be bundled in the APK')
              if any(name.startswith('assets/') and name.endswith('.onnx') and name not in allowed_models for name in names):
                  raise SystemExit('Only speech support and language-ID ONNX assets may be bundled in the APK')
              model = apk.read('assets/speech/silero_vad.onnx')
              if len(model) != speech.MODEL.size_bytes or sha256(model).hexdigest() != speech.MODEL.sha256:
                  raise SystemExit('Packaged Silero speech detector integrity verification failed')
              if 'lib/arm64-v8a/liblivecaption_translation.so' not in names:
                  raise SystemExit('Local translation JNI runtime is missing')
          print('Verified bundled speech support and local translation runtime; large models use explicit in-app setup')
          PY
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hebi-live-translate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

