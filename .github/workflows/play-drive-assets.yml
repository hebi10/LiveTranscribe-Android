name: Play approved store images

on:
  workflow_dispatch:
    inputs:
      ops06_store_approved:
        description: 'Independent approval for final Google Play listing/graphics update'
        required: true
        type: boolean
        default: false
      ops06_confirmation:
        description: 'Type APPLY_VERIFIED_PLAY_STORE_ASSETS for apply'
        required: false
        type: string
      ops06_expected_main_sha:
        description: 'Exact current approved main SHA'
        required: false
        type: string
      ops06_batch_id:
        description: 'Approved KST batch YYYY-MM-DD-livetranscribe-android'
        required: false
        type: string
      mode:
        description: "check validates the approved images; apply replaces ko-KR listing images"
        type: choice
        options: [check, apply]
        required: true
        default: check
      final_release_approved:
        description: 'Final batch only: approved image/listing update'
        required: true
        type: boolean
        default: false


permissions:
  contents: read
  actions: read

concurrency:
  group: play-com-hebi-livetranslate-store-images
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      publish: ${{ steps.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact main source and successful Android CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/play/source.py
      - name: Only automatically publish explicitly marked approved image update
        id: verify
        env:
          SOURCE_SHA: ${{ steps.ci.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_MODE: ${{ inputs.mode }}
          FINAL_RELEASE_APPROVED: ${{ inputs.final_release_approved }}
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo 'STORE IMAGES FROZEN: automatic Play image updates are disabled.' >&2
            exit 1
          fi
          if [[ "$REQUEST_MODE" == "apply" ]]; then
            if [[ "$FINAL_RELEASE_APPROVED" != "true" ]]; then
              echo 'Play approved image updates are frozen until the final release.' >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  listing:
    needs: source
    if: >-
      github.repository == 'hebi10/LiveTranscribe-Android' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && needs.source.result == 'success' &&
      (inputs.mode == 'check' || (inputs.mode == 'apply' &&
      inputs.final_release_approved == true && inputs.ops06_store_approved == true))
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: OPS-06 require separate store approval and exact source
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Check app-specific Google Play authentication
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PLAY_WORKLOAD_IDENTITY_PROVIDER" && -n "$PLAY_SERVICE_ACCOUNT" ]] ||
            { echo 'App-specific Workload Identity Federation is not configured.' >&2; exit 1; }
      - name: Authenticate for Play editing
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Verify original branding and refresh eight reviewed screenshots
        id: images
        run: |
          python3 scripts/play/drive_assets.py
          python3 scripts/play/refresh_20261111.py --manifest output/approved-play-images/assets/play-store/ko-KR/manifest.json
      - name: Reject stale source after verifying images
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/source.py --assert-current "$SOURCE_SHA"
      - name: Check Play registered-binary readiness
        if: needs.source.outputs.publish == 'true'
        id: readiness
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/play/publisher.py --report output/play-readiness.json inspect --require-binary
      - name: Commit reviewed Korean images only
        if: inputs.mode == 'apply'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PLAY_CONSOLE_INITIALIZED: ${{ steps.readiness.outputs.initialized }}
          IMAGE_MANIFEST: ${{ steps.images.outputs.manifest }}
        run: |
          python3 scripts/play/images_only.py --manifest "$IMAGE_MANIFEST" --report output/play-listing-images.json
      - name: Preserve non-secret verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-transcribe-play-images-${{ github.run_id }}
          path: |
            output/play-readiness.json
            output/play-listing-images.json
          if-no-files-found: ignore
