name: Play current UI captures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/play-capture.yml
      - app/src/androidTest/**
      - app/src/main/java/com/charles/livecaptionn/ui/**
      - app/src/main/java/com/charles/livecaptionn/overlay/**
      - app/src/main/java/com/charles/livecaptionn/MainActivity.kt
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/play-capture.yml
      - app/src/androidTest/**
      - app/src/main/java/com/charles/livecaptionn/ui/**
      - app/src/main/java/com/charles/livecaptionn/overlay/**
      - app/src/main/java/com/charles/livecaptionn/MainActivity.kt

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source privacy contract
        run: python scripts/audit_privacy.py
      - name: Cache pinned build-time support assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/speech
            app/src/main/assets/language-id
            app/libs
          key: ${{ runner.os }}-local-ai-support-${{ hashFiles('scripts/prepare_speech_support.py', 'scripts/prepare_language_id.py') }}
      - name: Prepare verified support assets and native source
        run: |
          python scripts/prepare_speech_support.py
          python scripts/prepare_language_id.py
          python scripts/prepare_speech_support.py --verify-only
          python scripts/prepare_language_id.py --verify-only
          python scripts/prepare_native_translation.py
      - name: Install pinned native build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build capture-only debug and instrumentation APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -PplayCaptureAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare device capture script
        run: |
          cat > "$RUNNER_TEMP/play-capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb logcat -c
          mkdir -p play-captures
          set +e
          ./gradlew --no-daemon -PplayCaptureAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.charles.livecaptionn.PlayStoreCaptureTest -Pandroid.testInstrumentationRunnerArguments.captureRevision="$GITHUB_SHA" connectedDebugAndroidTest
          capture_status=$?
          adb logcat -d > play-captures/logcat.txt
          adb pull /sdcard/Download/hebi-play-captures/. play-captures/
          pull_status=$?
          if [ "$capture_status" -eq 0 ] && [ "$pull_status" -eq 0 ]; then
            ./gradlew --no-daemon -PplayCaptureAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.charles.livecaptionn.OverlayVisualCaptureTest connectedDebugAndroidTest
            overlay_status=$?
            adb pull /sdcard/Download/hebi-overlay-captures/. play-captures/
            overlay_pull_status=$?
          else
            overlay_status=1
            overlay_pull_status=1
          fi
          if [ "$overlay_status" -eq 0 ] && [ "$overlay_pull_status" -eq 0 ]; then
            ./gradlew --no-daemon -PplayCaptureAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.charles.livecaptionn.HistoryUiCaptureTest connectedDebugAndroidTest
            history_status=$?
            adb pull /sdcard/Download/hebi-history-qa-captures/. play-captures/
            history_pull_status=$?
          else
            history_status=1
            history_pull_status=1
          fi
          set -e
          test "$capture_status" -eq 0
          test "$pull_status" -eq 0
          test "$overlay_status" -eq 0
          test "$overlay_pull_status" -eq 0
          test "$history_status" -eq 0
          test "$history_pull_status" -eq 0
          test -f play-captures/capture-manifest.json
          SH
      - name: Capture genuine current app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/play-capture.sh"
      - name: Verify capture set and source provenance
        env:
          CAPTURE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import struct
          from pathlib import Path

          directory = Path("play-captures")
          manifest = json.loads((directory / "capture-manifest.json").read_text(encoding="utf-8"))
          assert manifest["sourceRevision"] == os.environ["CAPTURE_REVISION"]
          assert manifest["applicationId"] == "com.hebi.livetranslate.debug"
          assert len(manifest["screenshots"]) == 6
          for name in manifest["screenshots"]:
              assert Path(name).name == name
              with (directory / name).open("rb") as image:
                  header = image.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n", name
              assert struct.unpack(">II", header[16:24]) == (1080, 1920), name
          for name in ("07-popup-compact.png", "08-popup-expanded.png", "09-popup-minimized.png"):
              with (directory / name).open("rb") as overlay_image:
                  header = overlay_image.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n", name
              assert struct.unpack(">II", header[16:24]) == (1080, 1920), name
          qa_manifest = json.loads((directory / "qa-history-manifest.json").read_text(encoding="utf-8"))
          assert qa_manifest["scope"] == "Synthetic local history UI QA only; never use as Play Store screenshots."
          assert qa_manifest["applicationId"] == "com.hebi.livetranslate.debug"
          for name in ("qa-10-history-list-light.png", "qa-11-history-no-results.png",
                       "qa-12-history-delete-confirm.png", "qa-13-history-list-dark.png"):
              assert name in qa_manifest["screenshots"]
              with (directory / name).open("rb") as history_image:
                  header = history_image.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n", name
              assert struct.unpack(">II", header[16:24]) == (1080, 1920), name
          assert {item["file"]: (item["width"], item["height"]) for item in manifest["graphics"]} == {
              "icon.png": (512, 512), "featureGraphic.png": (1024, 500)
          }
          for item in manifest["graphics"]:
              name = item["file"]
              assert Path(name).name == name
              with (directory / name).open("rb") as image:
                  header = image.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n", name
              assert struct.unpack(">II", header[16:24]) == (item["width"], item["height"]), name
          import hashlib
          groups = [
              ("idle", manifest["screenshots"]),
              ("overlay-ui-no-inference", ["07-popup-compact.png", "08-popup-expanded.png", "09-popup-minimized.png"]),
              ("synthetic-history-qa", qa_manifest["screenshots"]),
          ]
          evidence = []
          for category, filenames in groups:
              for name in filenames:
                  payload = (directory / name).read_bytes()
                  evidence.append({
                      "name": name,
                      "kind": category,
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  })
          assert len(evidence) == 13
          assert len({item["sha256"] for item in evidence}) == len(evidence), "Duplicate captured PNG"
          (directory / "ui-gap-00-evidence.json").write_text(
              json.dumps({
                  "sourceRevision": os.environ["CAPTURE_REVISION"],
                  "applicationId": manifest["applicationId"],
                  "apiLevel": manifest["apiLevel"],
                  "device": manifest["device"],
                  "screenshotCount": len(evidence),
                  "inferenceVerified": False,
                  "screenshots": evidence,
                  "notCaptured": [
                      "model download success or failure",
                      "real microphone or video audio recognition",
                      "real translated captions",
                      "permission denial and recovery",
                      "real user-history persistence",
                      "physical-device overlay and split-screen performance",
                  ],
              }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Verified 13 device PNGs, SHA-256 evidence and missing-state inventory; no audio inference.")
          PY
      - name: Upload current UI captures and device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-current-ui-${{ github.sha }}
          path: |
            play-captures/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
