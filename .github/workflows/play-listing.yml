name: Play Korean store listing

on:
  workflow_dispatch:
    inputs:
      ops06_store_approved:
        description: 'Independent approval for final Google Play listing/graphics update'
        required: true
        type: boolean
        default: false
      ops06_confirmation:
        description: 'Type APPLY_VERIFIED_PLAY_STORE_ASSETS for apply'
        required: false
        type: string
      ops06_expected_main_sha:
        description: 'Exact current approved main SHA'
        required: false
        type: string
      ops06_batch_id:
        description: 'Approved KST batch YYYY-MM-DD-livetranscribe-android'
        required: false
        type: string
      mode:
        description: 'check = local validation only; apply = replace reviewed Korean listing and explicit image categories'
        type: choice
        default: check
        options: [check, apply]
        required: true
      send_for_review:
        description: 'Send committed changes for review instead of keeping them pending in Console'
        type: boolean
        default: false
      final_release_approved:
        description: 'Final batch only: all planned features and integration/device QA approved'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-com-hebi-livetranslate
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require explicit final release approval for Play changes
        if: inputs.mode == 'apply'
        env:
          FINAL_RELEASE_APPROVED: ${{ inputs.final_release_approved }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FINAL_RELEASE_APPROVED" != "true" ]]; then
            echo 'Play store changes are frozen until final integration and explicit release approval.' >&2
            exit 1
          fi
      - name: Require main source and completed required CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/play/source.py
      - name: Validate reviewed listing and image inputs
        run: python3 scripts/play/listing.py check

  apply:
    needs: source
    if: >-
      github.repository == 'hebi10/LiveTranscribe-Android' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' &&
      inputs.final_release_approved == true && inputs.ops06_store_approved == true
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: OPS-06 require separate store approval and exact source
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Check Play authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        id: wif
        if: steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with legacy service-account JSON
        id: json
        if: steps.credentials.outputs.auth_mode == 'json'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Verify registered binary before API listing changes
        id: readiness
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/play/publisher.py --report output/play-readiness.json inspect --require-binary
      - name: Reject source superseded during verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/source.py --assert-current "$SOURCE_SHA"
      - name: Submit listing and require fresh text and image hash readback
        env:
          PLAY_CONSOLE_INITIALIZED: ${{ steps.readiness.outputs.initialized }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          SEND_FOR_REVIEW: ${{ inputs.send_for_review }}
        shell: bash
        run: |
          args=()
          if [[ "$SEND_FOR_REVIEW" == 'true' ]]; then args+=(--send-for-review); fi
          python3 scripts/play/listing.py apply --report output/play-listing.json "${args[@]}"
      - name: Preserve non-secret listing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-listing-report-${{ github.run_id }}
          path: |
            output/play-listing.json
            output/play-readiness.json
          if-no-files-found: ignore
          retention-days: 30
